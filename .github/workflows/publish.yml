name: publish
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to a commit
      - name: Install
        run: pip install -q "cryptography>=42,<50" "requests>=2.31,<3"
      - name: Publish due posts
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: python publisher/publish.py
